services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./:/app
      - db-data:/data
    environment:
      - NFL_FIDOS_ENV=local
      - NFL_FIDOS_HOST=0.0.0.0
      - NFL_FIDOS_PORT=8080
      - NFL_FIDOS_DATABASE=/data/nfl_fidos.sqlite3
      - NFL_FIDOS_FFMPEG=ffmpeg
      - NFL_FIDOS_FFPROBE=ffprobe
      - NFL_FIDOS_OBSERVABILITY_PATH=/data/observability.jsonl
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "python scripts/seed_demo_data.py --no-media && exec python -m nfl_fidos.server"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: on-failure

  web:
    image: node:22-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    environment:
      - VITE_API_PROXY_TARGET=http://api:8080
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/app/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

volumes:
  db-data:
