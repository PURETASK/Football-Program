name: NFL FIDOS validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Run Python regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee python-test.log
      - name: Run seeded Stage 0 runtime smoke
        run: python scripts/stage0_runtime_smoke.py --database .runtime/stage0-ci.sqlite3
      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log
          path: python-test.log
      - run: python scripts/run_evals.py
      - run: python scripts/validate_control_plane.py
      - name: Audit master plan conformance
        run: python scripts/project_audit.py --skip-evals --output .runtime/project-audit-ci.json
      - name: Upload master plan audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-plan-audit-evidence
          path: .runtime/project-audit-ci.json
      - run: python scripts/validate_deployment_contract.py
      - run: python scripts/incident_rehearsal.py
      - run: python scripts/operational_rehearsal.py
      - run: python -m compileall -q src scripts

  container:
    name: Build production container
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build image without publishing
        run: docker build --pull --tag nfl-fidos:ci .
      - name: Inspect image metadata
        run: docker image inspect nfl-fidos:ci --format '{{.Id}} {{.Size}}'
      - name: Run production-configured health smoke test
        shell: bash
        run: |
          set -euo pipefail
          data_dir="${RUNNER_TEMP}/nfl-fidos-data"
          secret_dir="${RUNNER_TEMP}/nfl-fidos-secret"
          mkdir -p "$data_dir" "$secret_dir"
          printf '%s' 'ci-only-secret-012345678901234567890123' > "$secret_dir/nfl_fidos_auth_secret"
          chmod 600 "$secret_dir/nfl_fidos_auth_secret"
          cleanup() { docker rm --force nfl-fidos-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name nfl-fidos-ci --publish 18080:8080 \
            --volume "$data_dir:/var/lib/nfl-fidos" \
            --volume "$secret_dir/nfl_fidos_auth_secret:/run/secrets/nfl_fidos_auth_secret:ro" \
            nfl-fidos:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs nfl-fidos-ci
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 20); do
            health="$(docker inspect nfl-fidos-ci --format '{{.State.Health.Status}}')"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$health" == "unhealthy" || "$attempt" == "20" ]]; then
              docker logs nfl-fidos-ci
              exit 1
            fi
            sleep 2
          done
          test -f "$data_dir/nfl_fidos.sqlite3"
