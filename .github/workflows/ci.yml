name: NFL FIDOS validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests -q
      - run: python scripts/run_evals.py
      - run: python scripts/validate_control_plane.py
      - run: python scripts/validate_deployment_contract.py
      - run: python scripts/incident_rehearsal.py
      - run: python scripts/operational_rehearsal.py
      - run: python -m compileall -q src scripts

  container:
    name: Build production container
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build image without publishing
        run: docker build --pull --tag nfl-fidos:ci .
      - name: Inspect image metadata
        run: docker image inspect nfl-fidos:ci --format '{{.Id}} {{.Size}}'
